<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban</title><link rel="stylesheet" href="/style.css"></head><body><header><div class="brand">Kanban<span class="brand-dot">.</span></div><div id="account"></div></header><main><section id="auth" class="auth"><h1>Make room for the work.</h1><p>Sign in to your boards, or create an account to get started.</p><form id="auth-form"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="current-password"></label><button type="submit">Sign in</button></form><button class="text-button" id="auth-toggle" type="button">Create an account</button></section><section id="workspace" hidden><aside><div class="aside-head"><h2>Boards</h2><button id="new-board" title="New board" aria-label="New board">+</button></div><nav id="boards" aria-label="Boards"></nav></aside><div class="main-panel"><div class="board-head"><div><p class="eyebrow">Workspace</p><h1 id="board-title">Choose a board</h1></div><div id="board-actions"></div></div><div id="toolbar" hidden><input id="search" type="search" placeholder="Search titles and descriptions" aria-label="Search cards"><select id="label-filter" aria-label="Filter by label"><option value="">All labels</option></select><label class="check"><input id="overdue-filter" type="checkbox"> Overdue only</label></div><div id="columns" class="columns"></div><p id="empty" class="empty">Create a board to get started.</p></div></section></main><dialog id="editor"><form id="editor-form"><h2 id="editor-title">Card</h2><label>Title<input name="title" required maxlength="200"></label><label>Description<textarea name="description" rows="4"></textarea></label><label>Due date<input name="due_date" type="date"></label><fieldset id="card-labels"><legend>Labels</legend></fieldset><div class="dialog-actions"><button type="button" class="secondary" id="cancel-editor">Cancel</button><button type="submit">Save card</button></div></form></dialog><div id="notice" role="status" aria-live="polite"></div><script src="/app.js" defer></script></body></html>
